name: Simulation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim:
    name: Simulation (${{ matrix.simulator }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        simulator: [verilator, icarus]
    steps:
      - uses: actions/checkout@v7
      - uses: YosysHQ/setup-oss-cad-suite@v4
        with:
          version: "2026-11-24"
          github-token: ${{ github.token }}
      - run: ./scripts/sim.sh ${{ matrix.simulator }}
